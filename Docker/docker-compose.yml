services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: esmeraldas-keycloak
    command: start --http-enabled=true --proxy-headers=xforwarded
    environment:
      # Conexión Segura a Base de Datos en Aiven Cloud (Persistencia Global)
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${AIVEN_DB_HOST:-dbesmeralda-resilieve-sistema-basededatos.f.aivencloud.com}:${AIVEN_DB_PORT:-24201}/${AIVEN_DB_NAME:-defaultdb}?sslmode=require
      KC_DB_USERNAME: ${AIVEN_DB_USER:-avnadmin}
      KC_DB_PASSWORD: ${AIVEN_DB_PASSWORD}

      # Credenciales del Administrador Maestro (Keycloak 24+)
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-Esmeraldas2026*}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-Esmeraldas2026*}

      # Configuración de Red y Proxy
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HEALTH_ENABLED: "true"

    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    restart: unless-stopped
